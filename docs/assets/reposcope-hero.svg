<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">RepoScope</title>
  <desc id="desc">RepoScope, explainable static repository analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1018"/>
      <stop offset="0.55" stop-color="#101a27"/>
      <stop offset="1" stop-color="#0d2330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#54d3b0"/>
      <stop offset="1" stop-color="#67a9ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="65" r="150" fill="#42d9b1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="400" r="160" fill="#559dff" opacity="0.07" filter="url(#glow)"/>

  <g transform="translate(72 76)">
    <rect x="0" y="0" width="74" height="74" rx="18" fill="#122a35" stroke="#55d5b3" stroke-width="2"/>
    <circle cx="31" cy="30" r="15" fill="none" stroke="#70e0c2" stroke-width="5"/>
    <path d="M42 42L57 57" stroke="#70e0c2" stroke-width="6" stroke-linecap="round"/>
    <path d="M18 19h24M18 29h8M18 39h10" stroke="#8fb5d8" stroke-width="2" opacity=".75"/>
  </g>

  <text x="172" y="120" fill="#f4f8fb" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="54" font-weight="750">RepoScope</text>
  <text x="74" y="178" fill="#b8c7d4" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24">Explainable static repository analysis.</text>
  <text x="74" y="216" fill="#8194a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17">Inspect repositories, surface review-worthy signals and make analysis coverage explicit.</text>

  <g transform="translate(74 276)" font-family="Segoe UI, Inter, Arial, sans-serif" filter="url(#shadow)">
    <g>
      <rect width="228" height="88" rx="16" fill="#111d29" stroke="#24394a"/>
      <text x="22" y="36" fill="#63d8b8" font-size="25" font-weight="700">26</text>
      <text x="22" y="62" fill="#b9c8d5" font-size="14">language / file families</text>
    </g>
    <g transform="translate(246 0)">
      <rect width="228" height="88" rx="16" fill="#111d29" stroke="#24394a"/>
      <text x="22" y="36" fill="#63d8b8" font-size="25" font-weight="700">147</text>
      <text x="22" y="62" fill="#b9c8d5" font-size="14">registered checks*</text>
    </g>
    <g transform="translate(492 0)">
      <rect width="268" height="88" rx="16" fill="#111d29" stroke="#24394a"/>
      <text x="22" y="36" fill="#69adff" font-size="20" font-weight="700">Static by default</text>
      <text x="22" y="62" fill="#b9c8d5" font-size="14">target code is not executed</text>
    </g>
    <g transform="translate(778 0)">
      <rect width="274" height="88" rx="16" fill="#111d29" stroke="#24394a"/>
      <text x="22" y="36" fill="#69adff" font-size="20" font-weight="700">Review-ready output</text>
      <text x="22" y="62" fill="#b9c8d5" font-size="14">Terminal · SARIF · JSON · Markdown</text>
    </g>
  </g>

  <text x="1124" y="408" text-anchor="end" fill="#617586" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">*count from the current reviewed build</text>
</svg>
