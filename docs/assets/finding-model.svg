<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">RepoScope conceptual finding model</title>
  <desc id="desc">A synthetic example showing severity, confidence, location, context and review guidance.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b141d"/><stop offset="1" stop-color="#101f2b"/></linearGradient></defs>
  <rect width="1200" height="370" rx="24" fill="url(#bg)"/>
  <text x="58" y="58" fill="#f1f5f8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="700">Anatomy of a finding</text>
  <text x="58" y="87" fill="#8397a8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Synthetic example — illustrates the public finding model, not an application screenshot.</text>
  <rect x="58" y="120" width="1084" height="194" rx="18" fill="#111d28" stroke="#2b4353"/>
  <text x="86" y="158" fill="#8197a8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">SAMPLE FINDING</text>
  <text x="86" y="196" fill="#f2f6f9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700">Potentially hidden failure path requires review</text>
  <rect x="86" y="220" width="122" height="34" rx="17" fill="#492a2e" stroke="#ba5d68"/>
  <text x="147" y="242" text-anchor="middle" fill="#ff9ca7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">SEVERITY · HIGH</text>
  <rect x="220" y="220" width="164" height="34" rx="17" fill="#20394a" stroke="#4d90bd"/>
  <text x="302" y="242" text-anchor="middle" fill="#8acbfa" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">CONFIDENCE · PROBABLE</text>
  <text x="86" y="285" fill="#9eb0bd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">Location</text>
  <text x="150" y="285" fill="#d9e3ea" font-family="Consolas, monospace" font-size="14">src/example.rs:42</text>
  <line x1="520" y1="145" x2="520" y2="289" stroke="#263b49"/>
  <text x="550" y="160" fill="#63d8b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">WHY REVIEW IT</text>
  <text x="550" y="188" fill="#bbc9d3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">The available evidence suggests a failure may be converted</text>
  <text x="550" y="210" fill="#bbc9d3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">into a neutral result while execution continues.</text>
  <text x="550" y="250" fill="#6aafff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">LEGITIMATE CASE</text>
  <text x="550" y="278" fill="#bbc9d3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">The behavior may be intentional when the operation is explicitly best-effort.</text>
  <text x="1142" y="346" text-anchor="end" fill="#5f7485" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Synthetic public example</text>
</svg>
